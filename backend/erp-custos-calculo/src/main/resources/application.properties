spring.application.name=erp-custos-calculo
server.port=8081
server.error.include-message=always

# RABBITMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin

# RABBITMQ LISTENER: mensagem rejeitada nao volta para a fila (segue para a DLX/DLQ)
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# TTL (ms) opcional das mensagens nas filas principais (0 = desabilitado). Deve ser igual nos dois servicos.
# app.rabbitmq.queue-message-ttl-ms=0
