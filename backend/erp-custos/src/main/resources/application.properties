spring.application.name=erp-custos
server.port=8080
server.error.include-message=always

# RABBITMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin

# DATASOURCE
spring.datasource.url=jdbc:h2:file:./data/erp-custos
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=admin

# JPA
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true

# H2 CONSOLE
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# RABBITMQ LISTENER: mensagem rejeitada nao volta para a fila (segue para a DLX/DLQ)
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# TTL (ms) opcional das mensagens nas filas principais (0 = desabilitado). Deve ser igual nos dois servicos.
# app.rabbitmq.queue-message-ttl-ms=0


# CARGA INICIAL (src/main/resources/data.sql)
# H2 em arquivo nao e tratado como "embedded", entao precisa de mode=always
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
